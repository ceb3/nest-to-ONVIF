services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1-ffmpeg
    container_name: mediamtx
    restart: unless-stopped
    ports:
      # Bound to the host's own address, not 0.0.0.0: the onvif container runs
      # an RTSP proxy on <camera-ip>:8554 for each macvlan IP, and a wildcard
      # bind here takes those addresses first and fails it with EADDRINUSE.
      # 203.0.113.1 is a placeholder (RFC 5737); setup deploy patches this to
      # network.host_ip from config (see patchComposeHostIP / bin/setup-deploy).
      - "203.0.113.1:8554:8554"
      - "127.0.0.1:8554:8554"
      - "203.0.113.1:8888:8888"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - snapshots:/snapshots

  snapshots:
    image: nginx:1.27-alpine
    container_name: snapshots
    restart: unless-stopped
    ports:
      # Specific addresses, as with MediaMTX: a wildcard bind would also claim
      # 8080 on every camera address and serve the snapshots to the whole LAN.
      # Loopback is required, not optional: the onvif container proxies Protect's
      # snapshot request to the http_port on its host source, which is 127.0.0.1,
      # and without this binding every snapshot fails with 502.
      - "203.0.113.1:8080:80"
      - "127.0.0.1:8080:80"
    volumes:
      - snapshots:/usr/share/nginx/html:ro

  onvif:
    # Built, not pulled: the upstream image serves no ONVIF Events service, so
    # Protect has nothing to put on a camera's timeline. deploy/onvif patches
    # one in. The base image stays pinned by digest inside that Dockerfile,
    # because this container carries the device identity Protect keys adoption
    # off and an image change must be a deliberate act.
    build:
      context: ./onvif
    image: onvif-virtual-camera-events:local
    container_name: onvif
    restart: unless-stopped
    # Required: the container binds the host's onvif-1..6 macvlan interfaces
    # directly and answers WS-Discovery multicast. Neither works from a bridge.
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      # Long syntax with create_host_path disabled: onvif.yml is generated and
      # git-ignored, and Compose would otherwise silently create a directory
      # here, mounting it at /config.yml and failing in a way that says nothing
      # about the missing generate step.
      - type: bind
        source: ./onvif.yml
        target: /config.yml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - mediamtx

  bridge:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nest-bridge:local
    container_name: nest-bridge
    restart: unless-stopped
    environment:
      # debug additionally reports Pub/Sub events dropped for devices that are
      # not in config.yaml, which is otherwise indistinguishable from Google
      # publishing nothing at all.
      - NEST_BRIDGE_LOG_LEVEL=${NEST_BRIDGE_LOG_LEVEL:-info}
    # Host networking so that media.rtsp_base_url can stay 127.0.0.1. The ONVIF
    # config derives its host source from that same value, and the onvif
    # container is already on the host network, so a bridge network here would
    # force the one setting to mean two different addresses.
    network_mode: host
    volumes:
      # config.yaml carries the OAuth client secret and tokens.json is rewritten
      # on every refresh, so this mount is read-write and must be owned by the
      # container's uid 10001.
      - type: bind
        source: ./config
        target: /config
        bind:
          create_host_path: false
      # The Pub/Sub key is mounted again, read-only, over the read-write mount
      # above. Nothing rewrites it — that mount is read-write only because
      # tokens.json is — and a credential the process cannot modify is one it
      # cannot corrupt. It must still be readable by uid 10001.
      - type: bind
        source: ./config/pubsub-sa.json
        target: /config/pubsub-sa.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - mediamtx

volumes:
  snapshots:

# Install as /etc/systemd/system/docker.service.d/nest-onvif.conf
#
# nest-onvif-macvlan.service declares Before=docker.service, which is ordering
# only: if the interface setup fails part way, Docker still starts and Protect
# sees some cameras present and others absent, with nothing to say why. Requires=
# makes that failure stop Docker instead, so the fault is visible where it
# happened rather than as a partial camera list in Protect.
[Unit]
Requires=nest-onvif-macvlan.service
After=nest-onvif-macvlan.service

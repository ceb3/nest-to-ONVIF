name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: gofmt -l . | tee /dev/stderr | (! read)
